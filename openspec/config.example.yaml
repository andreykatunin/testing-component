# Скопируйте или объедините с openspec/config.yaml проекта.
schema: analysis-driven

# context добавляется в инструкции каждого артефакта. Оставляйте здесь только
# краткие стабильные факты, которые нельзя надёжно определить из репозитория:
# продукт и предметную область, словарь, обязательные ограничения, стек и команды.
context: |
  Рабочий язык требований: русский.

# rules добавляются только в инструкцию одноимённого артефакта. Правила для
# business_requirements, system_requirements и test_cases схема передаёт
# соответствующему субагенту. Не дублируйте здесь его профессиональные инструкции
# или структуру шаблона — фиксируйте только соглашения конкретного проекта.
# Раскомментируйте только применимые примеры и замените ссылки/роли на реальные.
#
# rules:
#   proposal:
#     - Указывать затронутые команды согласно CODEOWNERS.
#   business_requirements:
#     - Использовать термины из docs/domain-glossary.md.
#     - Согласующим может быть только Product Owner соответствующего продукта.
#   system_requirements:
#     - Новые HTTP API должны соответствовать docs/api-conventions.md.
#     - Изменения событий должны сохранять обратную совместимость один релиз.
#   specs:
#     - Имена capabilities должны использовать термины предметной области.
#   design:
#     - Подключение новой технологии требует ссылки на принятый ADR.
#   test_cases:
#     - Для критичных пользовательских сценариев использовать тег smoke.
#     - Поддерживаемые окружения брать из docs/test-matrix.md.
#   tasks:
#     - Для изменений схемы данных добавлять отдельную задачу проверки миграции.

# operations применяются во время выполнения и завершения change, а не при
# подготовке ролевых артефактов.
operations:
  apply:
    guidance:
      - Не начинать реализацию при незакрытых блокирующих вопросах.
      - При расхождении сначала обновить требования, затем downstream-артефакты и только потом код.
  archive:
    guidance:
      - Сначала выполнить `/opsx:verify <change-id>`.
      - Проверить актуальность specs, test-cases.md и tasks.md.
      - Убедиться, что результаты конкретных запусков тестов не записаны в test-cases.md.
