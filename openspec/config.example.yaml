# Скопируйте/объедините с openspec/config.yaml проекта.
schema: analysis-driven

context: |
  Рабочий язык требований: русский.
  Требования являются источником истины; код не должен молча менять их смысл.
  Существующее поведение системы подтверждается ссылками на код, конфигурацию или тесты.
  Бизнес-аналитик владеет business-requirements.md.
  Системный аналитик владеет system-requirements.md.
  Стабильные ID требований не перенумеровываются без явной причины.

rules:
  proposal:
    - Не включать детальный технический дизайн.
    - Указать затронутые возможности и заинтересованные стороны.
  business_requirements:
    - MUST использовать subagent business-analyst.
    - Сохранять структуру шаблона и стабильные идентификаторы.
    - Не придумывать архитектуру, API, таблицы или технологии.
  system_requirements:
    - MUST использовать subagent system-analyst после business-analyst.
    - Каждое системное требование трассировать к бизнес-требованию либо помечать Technical/Internal.
    - Утверждения об AS-IS подтверждать репозиторными доказательствами.
  specs:
    - Использовать SHALL и конкретные GIVEN/WHEN/THEN сценарии.
    - Не переносить детали реализации из design.md.
  design:
    - Ссылаться на ID требований и фиксировать альтернативы и trade-offs.
  tasks:
    - Каждая задача должна быть проверяемой и иметь ссылки на требования.

operations:
  apply:
    guidance:
      - Не начинать реализацию при незакрытых блокирующих вопросах требований.
      - При обнаружении расхождения сначала обновить соответствующий аналитический артефакт.
  archive:
    guidance:
      - Перед архивированием проверить трассировку требований к specs, задачам и тестам.
