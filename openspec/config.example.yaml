# Скопируйте или объедините с openspec/config.yaml проекта.
schema: analysis-driven

# Здесь хранится контекст, дополнительные правила и операции конкретного проекта.
# Универсальные контракты артефактов находятся в schema.yaml, правила ролей —
# в .qwen/agents/, а управление диалогом и переходами — в корневом AGENTS.md.
context: |
  Рабочий язык требований: русский.

  Добавьте сюда только сведения, которые агент не может надёжно определить
  из репозитория, например:
  - краткое описание продукта и предметной области;
  - используемые в компании термины;
  - внешние нормативные ограничения;
  - ссылки на обязательные архитектурные или API-конвенции;
  - команды сборки и проверки, если они неочевидны.

# Добавляйте сюда только правила конкретного проекта, которых нет в schema.yaml.
# Удалите комментарии и оставьте только применимые разделы.
#
# rules:
#   business_requirements:
#     - Использовать термины из корпоративного глоссария.
#   system_requirements:
#     - Новые HTTP API должны соответствовать принятой API-конвенции.
#     - Изменения событий должны сохранять обратную совместимость один релиз.
#   test_cases:
#     - Для критичных пользовательских сценариев использовать тег smoke.
#   tasks:
#     - Для изменений схемы данных добавлять отдельную задачу проверки миграции.

operations:
  apply:
    guidance:
      - Перед реализацией выполнить `node scripts/check-workflow.mjs <change-id> --stage apply`.
      - Остановиться при ненулевом exit code.
      - Не начинать реализацию при незакрытых блокирующих вопросах.
      - При расхождении сначала обновить требования, затем downstream-артефакты и только потом код.
  archive:
    guidance:
      - Сначала выполнить `/opsx:verify <change-id>`.
      - Проверить актуальность specs, test-cases.md и tasks.md.
      - Убедиться, что результаты конкретных запусков тестов не записаны в test-cases.md.
