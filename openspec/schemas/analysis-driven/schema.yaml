name: analysis-driven
version: 1
description: OpenSpec-процесс с предварительной бизнес-, системной и QA-аналитикой перед формированием задач реализации.

artifacts:
  - id: proposal
    generates: proposal.md
    description: Краткое предложение изменения, за которое отвечает основной агент.
    template: proposal.md
    instruction: |
      Используй только явный ввод оператора и подтверждённые результаты /opsx:explore.
      Если не определены проблема, ожидаемый результат или границы изменения,
      не создавай файл: задай оператору до пяти вопросов и дождись ответов.
      Не превращай предложение агента в подтверждённый факт.
      Когда информации достаточно, покажи проект проблемы, результата, in/out scope,
      существенного влияния, рисков и открытых вопросов.
      Создай proposal.md только после явного подтверждения проекта оператором.
      Пиши кратко и не добавляй требования или детали реализации.
    requires: []

  - id: business_requirements
    generates: business-requirements.md
    description: Существенные бизнес-требования, за которые отвечает субагент business-analyst и которые согласует владелец бизнеса.
    template: business-requirements.md
    instruction: |
      ОБЯЗАТЕЛЬНО сначала попроси `business-analyst` проанализировать proposal
      и подготовить проект требований без изменения файла.
      Если он вернул вопросы, передай их оператору и после ответов повтори анализ.
      Когда проект готов, покажи оператору BR-*, AC-*, допущения и BQ-*.
      После явного согласования повторно вызови `business-analyst`: сообщи, что
      приведённый проект согласован, и попроси записать только его и ответы оператора.
      Артефакт готов, когда каждый BR-* имеет источник, каждый AC-* ссылается на BR-*,
      нет блокирующих BQ-*, а основной агент заполнил Approved и Approved by.
      Не добавляй архитектурные решения и детали реализации.
    requires: [proposal]

  - id: system_requirements
    generates: system-requirements.md
    description: Существенные системные требования, за которые отвечает субагент system-analyst.
    template: system-requirements.md
    instruction: |
      Начинай только после Approved business-requirements.md.
      ОБЯЗАТЕЛЬНО сначала попроси `system-analyst` исследовать репозиторий и
      подготовить проект системных требований без изменения файла.
      Если он вернул вопросы, передай их оператору и после ответов повтори анализ.
      Когда проект готов, покажи оператору трассировку BR/AC → SR/NFR, технические
      доказательства, существенные контракты и SQ-*.
      После явного подтверждения повторно вызови `system-analyst`: сообщи, что
      приведённый проект подтверждён, и попроси записать только его и ответы оператора.
      Артефакт готов, когда каждый SR-* имеет источник и способ проверки, каждый NFR-*
      измерим и имеет источник, а блокирующие SQ-* отсутствуют.
      Не переопределяй бизнес-смысл и не добавляй решения из design.
    requires: [business_requirements]

  - id: specs
    generates: specs/**/*.md
    description: Delta-спецификации OpenSpec, за которые отвечает основной агент и которые выводятся из согласованного бизнес-смысла и системных требований.
    template: spec.md
    instruction: |
      Перед созданием specs выполни:
      `node scripts/check-workflow.mjs <change-id> --stage requirements`.
      Остановись, если проверка требований завершилась ошибкой.
      Создай одну delta-спецификацию для каждой затронутой возможности.
      Выводи наблюдаемые требования и сценарии из business-requirements.md и
      system-requirements.md.
      Используй разделы ADDED, MODIFIED, REMOVED или RENAMED.
      Заголовки Requirement являются стабильными идентификаторами OpenSpec;
      при переименовании используй RENAMED.
      Каждое требование должно ссылаться на исходные ID и содержать хотя бы один
      уникальный сценарий SC-* в формате GIVEN/WHEN/THEN.
      Детали реализации храни в design.md, а не в specs.
    requires: [business_requirements, system_requirements]

  - id: design
    generates: design.md
    description: Краткий технический дизайн, за который отвечает основной агент.
    template: design.md
    instruction: |
      Объясни, как будут реализованы требования, и обоснуй решение доказательствами
      из репозитория.
      Зафиксируй только существенные решения, компромиссы, изменения контрактов
      и данных, аспекты надёжности и безопасности, выпуск и откат.
      Ссылайся на ID SR/NFR и не меняй требования молча.
      Для неприменимых разделов используй N/A вместо формального текста.
    requires: [system_requirements, specs]

  - id: test_cases
    generates: test-cases.md
    description: Компактные независимые от TMS тест-кейсы, за которые отвечает субагент qa-engineer.
    template: test-cases.md
    instruction: |
      ОБЯЗАТЕЛЬНО сначала попроси `qa-engineer` подготовить проект тест-кейсов
      без изменения файла.
      Если он вернул вопросы, передай их оператору или владельцу исходного требования
      и после ответов повтори анализ.
      Когда проект готов, покажи оператору покрытие, TC-* и QA-Q-*.
      После явного подтверждения повторно вызови `qa-engineer`: сообщи, что
      приведённый проект подтверждён, и попроси записать только его и ответы оператора.
      Артефакт готов, когда каждый TC-* имеет Refs, приоритет, воспроизводимые шаги
      и наблюдаемые результаты, а блокирующие QA-Q-* отсутствуют.
      Сохраняй существующие External ID и Automation Reference.
      Не придумывай поведение, не храни результаты выполнения и не публикуй кейсы в TMS.
    requires: [specs, design]

  - id: tasks
    generates: tasks.md
    description: Трассируемый список задач реализации и проверки, за который отвечает основной агент.
    template: tasks.md
    instruction: |
      Создай короткий упорядоченный список задач со стабильными идентификаторами TASK-*.
      Не превращай нерешённые блокирующие вопросы в задачи реализации.
      Каждая задача должна содержать Refs и Verify.
      Добавляй Depends on или Done when только тогда, когда они существенно уточняют
      сложную задачу.
      Используй test-cases.md для определения необходимых автоматических и ручных проверок.
      Включай только применимые работы по реализации, проверке, миграции, документации,
      телеметрии и выпуска.
      Не устанавливай Readiness: Ready без явного согласования.
    requires: [specs, design, test_cases]

apply:
  requires: [tasks]
  tracks: tasks.md
