name: analysis-driven
version: 1
description: OpenSpec-процесс с предварительной бизнес-, системной и QA-аналитикой перед формированием задач реализации.

artifacts:
  - id: proposal
    generates: proposal.md
    description: Краткое предложение изменения, за которое отвечает основной агент.
    template: proposal.md
    instruction: |
      Используй только явный ввод пользователя и подтверждённые результаты исследования.
      Если не определены проблема, ожидаемый результат или границы изменения,
      задай до пяти вопросов и не создавай proposal.md.
      Когда данных достаточно, покажи пользователю полный проект proposal.md без записи.
      Создай файл только после явного подтверждения представленного проекта.
      Артефакт готов, когда определены проблема, ожидаемый результат и in/out scope,
      а неподтверждённые сведения сохранены только как открытые вопросы.
      Не добавляй требования, детали реализации или предположения.
    requires: []

  - id: business_requirements
    generates: business-requirements.md
    description: Существенные бизнес-требования, за которые отвечает субагент business-analyst и которые согласует владелец бизнеса.
    template: business-requirements.md
    instruction: |
      Ключевая задача этапа — с помощью `business-analyst` уточнить у пользователя
      бизнес-потребность, границы изменения, правила, ограничения и критерии приёмки,
      а затем согласовать целостный набор бизнес-требований.
      Передай `business-analyst` proposal и полученные из CLI `context`, `rules`,
      `template` и `resolvedOutputPath`. Попроси проанализировать исходные сведения
      и вернуть вопросы, если без ответов пользователя требования нельзя сформулировать
      однозначно.
      Передавай вопросы пользователю без изменения смысла, а полученные ответы —
      обратно `business-analyst`. Повторяй уточнение, пока не будут разрешены
      блокирующие неопределённости и подготовлен согласованный проект требований.
      Покажи пользователю полный проект, включая BR-*, AC-*, существенные допущения
      и оставшиеся BQ-*. Если пользователь предлагает изменения, передай их
      `business-analyst` для повторного анализа.
      После явного согласования попроси `business-analyst` создать
      business-requirements.md из согласованного содержания и сохранить в нём
      существенные ответы пользователя.
      Артефакт готов, когда каждый BR-* имеет источник, каждый AC-* ссылается хотя бы
      на один BR-*, нет открытых BQ-* со значением «Блокирует: Да», а у каждого BQ-*
      со статусом Resolved заполнено поле «Ответ / решение».
    requires: [proposal]

  - id: system_requirements
    generates: system-requirements.md
    description: Существенные системные требования, за которые отвечает субагент system-analyst.
    template: system-requirements.md
    instruction: |
      Ключевая задача этапа — с помощью `system-analyst` преобразовать согласованные
      бизнес-требования и подтверждённое состояние системы в однозначные, реализуемые
      и проверяемые системные требования, а затем согласовать их с пользователем.
      Передай `system-analyst` business-requirements.md и полученные из CLI `context`,
      `rules`, `template` и `resolvedOutputPath`. Попроси исследовать релевантные части
      системы, определить разрыв между AS-IS и требуемым поведением и вернуть вопросы,
      если необходимое решение нельзя достоверно получить из доступных источников.
      Передавай вопросы пользователю без изменения смысла, а полученные ответы —
      обратно `system-analyst`. Повторяй уточнение, пока не будут разрешены
      блокирующие неопределённости и подготовлен согласованный проект требований.
      Покажи пользователю полный проект, включая трассировку BR/AC → SR/NFR,
      доказательства AS-IS, существенные контракты, gaps и оставшиеся SQ-*.
      Если пользователь предлагает изменения, передай их `system-analyst`
      для повторного анализа.
      После явного согласования попроси `system-analyst` создать
      system-requirements.md из согласованного содержания и сохранить в нём
      существенные ответы пользователя.
      Артефакт готов, когда каждый SR-* имеет источник и наблюдаемый способ проверки,
      каждый NFR-* измерим и имеет подтверждённый источник, каждый BR-*/AC-* отражён
      в трассировке как Covered, Gap или обоснованный N/A, нет открытых SQ-* со
      значением «Блокирует: Да», а у каждого SQ-* со статусом Resolved заполнено
      поле «Ответ / решение».
    requires: [business_requirements]

  - id: specs
    generates: specs/**/*.md
    description: Delta-спецификации OpenSpec, за которые отвечает основной агент и которые выводятся из согласованного бизнес-смысла и системных требований.
    template: spec.md
    instruction: |
      Перед созданием specs убедись, что нет открытых BQ-*/SQ-* со значением
      «Блокирует: Да», а у каждого вопроса со статусом Resolved заполнено поле
      «Ответ / решение».
      Остановись и вернись к владельцу требования, если условие не выполнено.
      Создай одну delta-спецификацию для каждой затронутой возможности.
      Выводи наблюдаемые требования и сценарии из business-requirements.md и
      system-requirements.md.
      Используй разделы ADDED, MODIFIED, REMOVED или RENAMED.
      Не создавай пустую delta-спецификацию.
      Заголовки Requirement являются стабильными идентификаторами OpenSpec;
      при переименовании используй RENAMED.
      Каждое требование должно ссылаться на исходные ID и содержать хотя бы один
      уникальный в пределах change сценарий SC-* в формате GIVEN/WHEN/THEN.
      Если подтверждённое upstream-требование нельзя однозначно выразить как
      наблюдаемое поведение, остановись и верни вопрос владельцу требования.
      Детали реализации храни в design.md, а не в specs.
    requires: [business_requirements, system_requirements]

  - id: design
    generates: design.md
    description: Краткий технический дизайн, за который отвечает основной агент.
    template: design.md
    instruction: |
      Объясни, как будут реализованы SR/NFR и specs. Обоснуй решения ссылками
      на релевантный код, конфигурацию, существующие контракты, принятые ADR
      и подтверждённые ограничения.
      Зафиксируй только необходимые для реализации взаимодействия, изменения
      контрактов и данных, существенные компромиссы, аспекты надёжности и
      безопасности, rollout и rollback.
      Ссылайся на SR/NFR. Если дизайн требует изменить или дополнить требование,
      не компенсируй это техническим решением: остановись и верни вопрос владельцу
      требования.
      Артефакт готов, когда для реализации не осталось незафиксированных
      блокирующих решений.
    requires: [system_requirements, specs]

  - id: test_cases
    generates: test-cases.md
    description: Компактные трассируемые тест-кейсы, за которые отвечает субагент qa-engineer.
    template: test-cases.md
    instruction: |
      Ключевая задача этапа — с помощью `qa-engineer` независимо проверить полноту
      и тестируемость согласованного поведения и сформировать компактное,
      воспроизводимое и риск-ориентированное покрытие.
      Передай `qa-engineer` business-requirements.md, system-requirements.md, specs,
      design и полученные из CLI `context`, `rules`, `template` и
      `resolvedOutputPath`. Попроси проанализировать источники и подготовить полный
      проект покрытия, тест-кейсов, существенных пробелов и QA-Q-*.
      Если ожидаемое поведение или способ проверки неоднозначны, верни вопрос
      владельцу исходного требования и не выбирай ответ самостоятельно.
      Покажи пользователю полный проект, включая покрытие, TC-* и оставшиеся QA-Q-*.
      Если пользователь предлагает изменения, передай их `qa-engineer` для повторного
      анализа.
      После явного согласования попроси `qa-engineer` создать test-cases.md из
      согласованного содержания.
      Артефакт готов, когда каждый применимый AC-*, SR-*, NFR-* и SC-* имеет TC-*
      либо обоснованный статус N/A, каждый TC-* имеет Refs, приоритет,
      воспроизводимые условия, шаги и наблюдаемые результаты, нет открытых QA-Q-*
      со значением «Блокирует: Да», а у каждого QA-Q-* со статусом Resolved заполнено
      поле «Ответ / решение».
    requires: [business_requirements, system_requirements, specs, design]

  - id: tasks
    generates: tasks.md
    description: Трассируемый список задач реализации и проверки, за который отвечает основной агент.
    template: tasks.md
    instruction: |
      Перед созданием tasks.md убедись, что в upstream-артефактах нет открытых
      вопросов со значением «Блокирует: Да». Если такие вопросы есть, остановись
      и верни их владельцам требований.
      Создай короткий упорядоченный план реализации и проверки со стабильными
      идентификаторами TASK-*.
      Каждая задача должна содержать Refs и Verify.
      Используй test-cases.md для определения необходимых автоматических, ручных,
      NFR и security-проверок.
      Включай только применимые работы по реализации, проверке, миграции,
      документации, телеметрии и выпуску.
    requires: [specs, design, test_cases]

apply:
  requires: [tasks]
  tracks: tasks.md
